# arquivos e o SQLite ficam num volume próprio que sobrevive à recriação do pod
apiVersion: v1
kind: Service
metadata:
  name: io-headless
  namespace: poi
spec:
  clusterIP: None
  selector: { app: io }
  ports:
    - { name: http, port: 8003 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: io
  namespace: poi
  labels: { app: io }
spec:
  serviceName: io-headless
  replicas: 1
  selector:
    matchLabels: { app: io }
  template:
    metadata:
      labels: { app: io }
    spec:
      containers:
        - name: io
          image: samuelclunaa/poi-io:latest
          env:
            - { name: WORKERS, value: "2" }
          ports:
            - { name: http, containerPort: 8003 }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            # a primeira subida gera os arquivos de seed no volume
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
